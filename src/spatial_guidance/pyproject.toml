[tool.poetry]
name = "spatial-guidance"
version = "0.1.0"
description = "DLVC-SoSe25 - 3D Spatial Scene Understanding and Interactive Audio Guidance for Blind Users"
authors = ["DLVC-Group-04"]
license = "MIT"
packages = [{ include = "spatial_guidance" }]

[tool.poetry.dependencies]
python = "^3.11"

# Core AI/ML libraries
google-genai = ">=1.20.0"
google-generativeai = ">=0.8.4"
pydantic = "=2.11.5"
numpy = "^2.3.0"
scipy = "^1.15.3"

# Image processing
Pillow = ">=11.1.0"
opencv-python = "^4.11.0"

# Streamlit web app
streamlit = ">=1.45.1"
streamlit-webrtc = ">=0.62.4"
watchdog = ">=6.0.0"

# Audio processing
pyaudio = ">=0.2.14"

# Visualization
matplotlib = "^3.10.0"

# Utilities
python-dotenv = ">=1.1.0"
rich = ">=14.0.0"
nest-asyncio = "^1.6.0"
pandas = "^2.3.0"

# Development tools
ipython = ">=9.3.0"
devtools = ">=0.12.2"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"